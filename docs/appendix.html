<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Appendix | MathChat</title><link rel="stylesheet" href="/assets/css/main.css">
<style>:root{--chalkboard-dark:#1a4a3a;--chalk-white:#f8f8f0;--chalk-dust:#e0e0e0}.mathchat-appendix{max-width:960px;margin:0 auto;padding:2rem 0 4rem;line-height:1.5}.mathchat-appendix .note{color:var(--chalk-dust)}.mathchat-appendix .entry{border:2px dashed var(--chalk-white);border-radius:.6rem;padding:1rem;margin:1rem 0;background:rgba(26,74,58,.38)}.mathchat-appendix .profile{border-left:3px solid var(--chalk-white);padding-left:.8rem;margin-top:1rem}code{white-space:pre-wrap}</style></head>
<body><div class="chalkboard-frame"></div><div class="chalkboard-content"><main class="mathchat-appendix"><p><a href="/MathChat/">← Viewpoint map</a></p><h1>Appendix: submitted sources</h1><p class="note">This page shows consented entries prepared in this browser. They are not public additions to the project until a maintainer reviews and commits them. No source is uploaded merely by being scored.</p><div id="entries"></div></main></div>
<script>const entries=JSON.parse(localStorage.getItem('mathchat-appendix-submissions')||'[]'),root=document.getElementById('entries');const text=(tag,value)=>{const n=document.createElement(tag);n.textContent=value;return n};if(!entries.length)root.innerHTML='<p>No local appendix submissions yet. <a href="score-your-source.html">Score a source</a> to prepare one.</p>';entries.forEach(e=>{const d=document.createElement('article');d.className='entry';d.append(text('h2',e.title));const scores=document.createElement('p');scores.innerHTML=`<strong>Provisional scores:</strong> outlook ${e.outlook}; evidence ${e.evidence}; reliability ${e.reliability}.`;d.append(scores);if(e.submitterName)d.append(text('p',`Submitted by: ${e.submitterName}`));d.append(Object.assign(text('p',e.excerpt),{className:'note'}));if(e.arxiv){const profile=document.createElement('section');profile.className='profile';profile.append(text('h3','arXiv snapshot'));const link=document.createElement('a');link.href=e.arxiv.url;link.target='_blank';link.rel='noopener';link.textContent=`arXiv:${e.arxiv.id}`;const source=document.createElement('p');source.append(link);if(e.arxiv.primaryCategory)source.append(` · ${e.arxiv.primaryCategory}`);profile.append(source);if(e.scoredTextLength)profile.append(text('p',`Score input: complete arXiv HTML paper (${e.scoredTextLength.toLocaleString()} characters).`));profile.append(Object.assign(text('p',e.arxiv.summary),{className:'note'}));const authors=document.createElement('p');authors.append(document.createTextNode('Author profile: '));e.arxiv.authors.forEach((author,i)=>{if(i)authors.append(', ');const a=document.createElement('a');a.href=author.profileUrl;a.target='_blank';a.rel='noopener';a.textContent=author.name;authors.append(a);if(author.affiliation)authors.append(` (${author.affiliation})`)});profile.append(authors);d.append(profile)}root.append(d)});</script></body>
</html>
